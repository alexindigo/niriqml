name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        lane: [coverage, qml]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.*"
          cache: true

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov cmake ninja-build \
            libgl1-mesa-dev libdbus-1-dev libxkbcommon-dev

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TEST_MODE=ON \
            -DENABLE_COVERAGE=${{ matrix.lane == 'coverage' && 'ON' || 'OFF' }} \
            -G Ninja

      - name: Build
        # Generated TUs peak near 1.2 GB; leave memory for Qt tooling and linking.
        run: cmake --build build --parallel 2

      - name: Test C++ coverage
        if: matrix.lane == 'coverage'
        run: ctest --test-dir build -L unit --output-on-failure

      - name: Test QML consumers (without coverage)
        if: matrix.lane == 'qml'
        run: ctest --test-dir build -L qml --output-on-failure

      - name: Capture coverage
        if: matrix.lane == 'coverage'
        run: |
          lcov --capture --directory build \
            --output-file coverage.info \
            --ignore-errors inconsistent,empty
          lcov --remove coverage.info \
            '*/tests/*' '*_autogen/*' '/usr/*' \
            --output-file coverage_clean.info \
            --ignore-errors unused,inconsistent
          genhtml coverage_clean.info \
            --output-directory coverage_html \
            --ignore-errors inconsistent
          lcov --summary coverage_clean.info

      - name: Upload coverage
        if: matrix.lane == 'coverage'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage_html/

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format-20

      - name: clang-format check
        run: clang-format-20 --dry-run --Werror niri*.cpp niri*.h tests/*.cpp tests/*.h

  release:
    runs-on: ubuntu-24.04
    container: ghcr.io/archlinux/archlinux:base-devel
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Init pacman keyring
        run: |
          pacman-key --init
          pacman-key --populate archlinux

      - name: Install deps
        run: |
          pacman -Syu --noconfirm \
            qt6-base qt6-declarative \
            cmake ninja gcc

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TEST_MODE=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -G Ninja

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package
        run: |
          DESTDIR="$PWD/release" cmake --install build
          tar -C release -czf \
            qt6-niriqml-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz \
            usr/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: qt6-niriqml-*.tar.gz
          draft: false
